name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
      - name: Test historical queries and validation boundaries
        run: python -m unittest discover -s tests -t . -v
      - name: Run the public walkthrough and regression scenarios
        run: |
          auditable-ai demo --output "$RUNNER_TEMP/demo.json"
          auditable-ai check-fixtures
      - name: Build and smoke-test the distributable
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/auditable-ai" demo
          "$RUNNER_TEMP/wheel-env/bin/auditable-ai" check-fixtures
