name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
      - name: Test without the optional SDK (SDK tests skip; nothing calls a model)
        run: python -m unittest discover -s tests -t . -v
      - name: Run the walkthrough, regression scenarios, example and baseline evaluation
        run: |
          auditable-ai demo --output "$RUNNER_TEMP/demo.json"
          auditable-ai check-fixtures
          python examples/quickstart.py
          auditable-ai evaluate --system baseline --split eval --output "$RUNNER_TEMP/baseline.json"
      - name: Test the Claude adapter through the real SDK over a mocked HTTP layer
        shell: bash
        run: |
          python -m pip install -e '.[claude]'
          python -m unittest tests.test_anthropic_adapter -v 2>&1 | tee "$RUNNER_TEMP/sdk-tests.log"
          if grep -q "skipped" "$RUNNER_TEMP/sdk-tests.log"; then echo "SDK tests were skipped"; exit 1; fi
      - name: Type-check in strict mode against the installed SDK
        run: mypy
      - name: Build and smoke-test the distributable
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/auditable-ai" demo
          "$RUNNER_TEMP/wheel-env/bin/auditable-ai" check-fixtures
          "$RUNNER_TEMP/wheel-env/bin/auditable-ai" evaluate --system baseline
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/examples/quickstart.py"

  mutation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install package, development tools and the optional SDK
        run: python -m pip install -e '.[dev,claude]'
      - name: Disable each stated guarantee in turn; the test suite must catch every one
        run: python tools/mutation_check.py
